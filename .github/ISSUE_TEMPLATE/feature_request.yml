name: Feature request
description: Suggest a developer workflow or product-feedback improvement.
title: "feature: "
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the current workflow and why it is insufficient.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround or alternatives considered
