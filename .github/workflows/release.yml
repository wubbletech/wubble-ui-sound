name: Release packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact semver version already committed in every public package manifest.
        required: true
        type: string
      publish:
        description: Publish packages to npm after verification has passed and the protected environment approves it.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run generate:fixtures
      - run: npm run release:version -- ${{ inputs.version }} --check
      - run: npm run check
      - run: npm test
      - run: npm run build --workspace @wubble/nextjs-example
      - run: npm audit --audit-level=high
      - run: npm run release:smoke

  publish:
    if: inputs.publish == true
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: wubble-npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run release:version -- ${{ inputs.version }} --check
      - run: npm run release:verify-metadata -- ${{ inputs.version }}
      - run: npm publish --workspace @wubble/manifest --access public --provenance
      - run: npm publish --workspace @wubble/sounds --access public --provenance
      - run: npm publish --workspace @wubble/react --access public --provenance
      - run: npm publish --workspace @wubble/react-native --access public --provenance
      - run: npm publish --workspace @wubble/core-pack --access public --provenance
      - run: npm publish --workspace @wubble/community-sfx --access public --provenance
      - run: npm publish --workspace @wubble/ui-sounds --access public --provenance
