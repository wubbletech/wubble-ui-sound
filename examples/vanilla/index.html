<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wubble UI Sounds - Local Pack Demo</title>
    <style>
      :root { color: #1e293b; background: #f8fafc; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(560px, calc(100% - 32px)); }
      h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: 0; }
      p { margin: 0 0 24px; color: #475569; line-height: 1.5; }
      section { border: 1px solid #cbd5e1; border-radius: 8px; background: #ffffff; padding: 20px; }
      .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
      button { min-height: 40px; border: 1px solid #94a3b8; border-radius: 6px; padding: 0 14px; background: #ffffff; color: #0f172a; font: inherit; cursor: pointer; }
      button.primary { border-color: #0f766e; background: #0f766e; color: #ffffff; }
      button:focus-visible { outline: 3px solid #38bdf8; outline-offset: 2px; }
      output { display: block; min-height: 24px; margin-top: 16px; color: #334155; }
      label { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@wubbleai/manifest": "/packages/manifest/src/index.js",
          "@wubbleai/sounds": "/packages/sounds/src/index.js"
        }
      }
    </script>
  </head>
  <body>
    <main>
      <h1>Local Pack Demo</h1>
      <p>This page plays only files served from this project. Sound is off until you enable it.</p>
      <section aria-labelledby="feedback-controls">
        <label id="feedback-controls"><input id="sound-enabled" type="checkbox" /> Enable interface sounds</label>
        <div class="controls">
          <button id="tap" type="button">Tap</button>
          <button id="success" class="primary" type="button">Success</button>
          <button id="error" type="button">Error</button>
        </div>
        <output id="status" aria-live="polite">Sound is disabled.</output>
      </section>
    </main>
    <script type="module">
      import { createFeedbackClient } from "@wubbleai/sounds";

      const manifest = await fetch("./public/wubble/signal/manifest.json").then((response) => response.json());
      const feedback = createFeedbackClient(manifest, {
        baseUrl: "./public/wubble/signal",
        onError: () => { status.textContent = "Sound could not play. The interface still works normally."; }
      });

      const status = document.querySelector("#status");
      const soundEnabled = document.querySelector("#sound-enabled");
      const buttons = ["tap", "success", "error"];

      soundEnabled.addEventListener("change", async () => {
        feedback.setEnabled(soundEnabled.checked);
        if (soundEnabled.checked) {
          const unlocked = await feedback.unlock();
          status.textContent = unlocked ? "Sound is enabled." : "Your browser did not allow sound yet.";
        } else {
          status.textContent = "Sound is disabled.";
        }
      });

      for (const eventName of buttons) {
        document.querySelector(`#${eventName}`).addEventListener("click", async () => {
          const result = await feedback[eventName]();
          status.textContent = result.played ? `${eventName} played locally.` : `No sound played: ${result.reason}.`;
        });
      }
    </script>
  </body>
</html>
